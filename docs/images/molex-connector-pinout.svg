<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="450" fill="#ffffff"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    4-pin plug — pin numbering
  </text>
  <text x="360" y="54" text-anchor="middle" font-size="14" fill="#555555">
    This is the loose plug that mates to the board's socket (J34/J35), unplugged —
  </text>
  <text x="360" y="72" text-anchor="middle" font-size="14" fill="#555555">
    looking straight into the exposed pin face, clip up, wire bundle exiting the back, away from you.
  </text>
  <text x="360" y="90" text-anchor="middle" font-size="14" fill="#555555">
    (mirrored left-right from the wire-side view of a connector already plugged into the board)
  </text>

  <!-- Latch tab -->
  <rect x="330" y="110" width="60" height="18" rx="3" fill="#cccccc" stroke="#333333" stroke-width="2"/>
  <text x="360" y="123" text-anchor="middle" font-size="11" fill="#333333">clip</text>

  <!-- Housing -->
  <rect x="210" y="128" width="300" height="220" rx="14" fill="#f2f2f2" stroke="#333333" stroke-width="3"/>

  <!-- Pin 3 (top-left) - B, black wire -->
  <circle cx="290" cy="200" r="34" fill="#333333" stroke="#000000" stroke-width="2.5"/>
  <text x="290" y="208" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">3</text>

  <!-- Pin 4 (top-right) - Return/GND, red wire -->
  <circle cx="430" cy="200" r="34" fill="#e34b4b" stroke="#333333" stroke-width="2.5"/>
  <text x="430" y="208" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">4</text>

  <!-- Pin 1 (bottom-left) - Supply, yellow wire -->
  <circle cx="290" cy="278" r="34" fill="#f2c94c" stroke="#333333" stroke-width="2.5"/>
  <text x="290" y="286" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">1</text>

  <!-- Pin 2 (bottom-right) - A, black wire with purple tape marker -->
  <circle cx="430" cy="278" r="34" fill="#333333" stroke="#9b59b6" stroke-width="4"/>
  <text x="430" y="286" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">2</text>

  <!-- Legend -->
  <g font-size="15" fill="#1a1a1a">
    <circle cx="70" cy="382" r="9" fill="#f2c94c" stroke="#333333" stroke-width="1.5"/>
    <text x="90" y="387">Pin 1 — Supply, +12 to 15VDC (yellow wire, per community reports)</text>

    <circle cx="70" cy="405" r="9" fill="#333333" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="410">Pin 3 — RS-485 B (black wire) · Pin 2 — RS-485 A (black wire, marked with purple tape)</text>

    <circle cx="70" cy="428" r="9" fill="#e34b4b" stroke="#333333" stroke-width="1.5"/>
    <text x="90" y="433">Pin 4 — Return / GND, 0VDC reference (red wire, per community reports)</text>
  </g>
</svg>
